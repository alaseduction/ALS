.page{max-width:1000px;margin:0 auto;padding:16px 14px 100px}
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--blanc);display:flex;border-top:1px solid var(--bord);z-index:10;padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;background:none;border:0;color:var(--gris);padding:8px 2px 7px;font-size:11px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.nav button.on{color:var(--noir);font-weight:700}.nav button.on svg{stroke:var(--or2)}
@media(min-width:900px){
 .side{display:flex;flex-direction:column;position:fixed;left:0;top:0;bottom:0;width:var(--side);background:var(--noir);color:#ddd;padding:16px 12px;z-index:11}
 .side .brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;border-bottom:1px solid #2c2c2c;margin-bottom:12px}
 .side .brand b{display:block;color:var(--or);letter-spacing:2px;font-size:13px}.side .brand small{color:#999;font-size:11px}
 .side button{display:flex;align-items:center;gap:12px;background:none;border:0;color:#cfcfcf;padding:10px 12px;border-radius:8px;cursor:pointer;width:100%;text-align:left;font-size:14px;margin-bottom:2px}
 .side button:hover{background:#242424}.side button.on{background:#2b2b2b;color:var(--or);font-weight:600}

 .main{margin-left:var(--side)}.nav{display:none}.bar{display:none}.main.full{margin-left:0}.main.full .bar{display:flex}
 .page{padding:24px 28px 40px}
}
/* page */
.ph{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.ph h1{font-size:20px;margin:0;font-weight:700;flex:1}
.card{background:var(--blanc);border-radius:12px;box-shadow:0 0 0 1px var(--bord),0 1px 2px rgba(0,0,0,.04);margin-bottom:14px;overflow:hidden}
.card .cb{padding:16px}.card h2{font-size:14px;margin:0 0 10px;font-weight:650}
.card .ch{padding:14px 16px;border-bottom:1px solid var(--bord);display:flex;align-items:center;gap:8px}.card .ch h2{margin:0;flex:1}
.btn{background:var(--noir);color:#fff;border:1px solid var(--noir);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn:hover{background:#2c2c2c}
.btn.or{background:var(--or);border-color:var(--or2);color:var(--noir)}
.btn.sec{background:var(--blanc);color:var(--txt);border-color:#c9cccf;box-shadow:0 1px 0 rgba(0,0,0,.05)}
.btn.red{background:var(--blanc);color:var(--rouge);border-color:#e0b3ad}
.btn.sm{padding:5px 10px;font-size:13px}.btn.full{width:100%}
label{display:block;font-size:13px;color:var(--txt);margin:12px 0 4px;font-weight:500}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid #8c9196;border-radius:8px;background:var(--blanc);font-size:14px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--or);outline-offset:0;border-color:var(--or2)}
input[type=checkbox]{width:auto}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.hint{color:var(--gris);font-size:12px;margin-top:4px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--bord);padding:0 10px;overflow-x:auto}
.tabs div{padding:12px 10px;cursor:pointer;color:var(--gris);white-space:nowrap;border-bottom:2px solid transparent;font-weight:500}
.tabs div.on{color:var(--txt);border-color:var(--or2);font-weight:650}
.search{padding:10px 12px;border-bottom:1px solid var(--bord)}.search input{border-color:var(--bord);background:#F7F7F7}
.badge{display:inline-block;font-size:12px;padding:2px 8px;border-radius:20px;font-weight:550;white-space:nowrap}
.b-ok{background:var(--vertbg);color:var(--vert)}.b-low{background:var(--jaunebg);color:var(--jaune)}.b-out{background:var(--rougebg);color:var(--rouge)}
.b-n{background:#E4E5E7;color:#444}.b-dep{background:var(--rose);color:var(--rose2)}.b-gold{background:#FFF1CC;color:var(--jaune)}
.list .r{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--bord);cursor:pointer}
.list .r:last-child{border-bottom:0}.list .r:hover{background:#FAFAFA}
.th{width:48px;height:48px;border-radius:8px;background:#EEE center/cover no-repeat;border:1px solid var(--bord);display:flex;align-items:center;justify-content:center;color:#aaa;font-size:11px;font-weight:700}
.r .n{font-weight:600}.r .s{color:var(--gris);font-size:12px}
.r .pr{text-align:right;font-weight:650}.r .pr small{display:block;font-weight:400;color:var(--gris)}
.dm{display:none}.list .hd{display:none}
@media(min-width:900px){
 .list .r{grid-template-columns:56px 2.4fr 1.1fr 1.2fr 0.8fr 1fr}.dm{display:block}
 .list .hd{display:grid;cursor:default;background:#F7F7F7;color:var(--gris);font-size:12px;font-weight:600;padding:8px 14px}.list .hd:hover{background:#F7F7F7}
 .mm{display:none}
}
.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:14px}
@media(min-width:900px){.metrics{grid-template-columns:repeat(4,1fr)}}
.m{background:var(--blanc);border-radius:12px;box-shadow:0 0 0 1px var(--bord);padding:14px}
.m span{color:var(--gris);font-size:12px}.m b{display:block;font-size:20px;margin-top:4px}
.two{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:900px){.two{grid-template-columns:2fr 1fr}}
.ph-box{width:100%;height:170px;border:1.5px dashed #b5b8bb;border-radius:10px;background:#FAFAFA center/cover no-repeat;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--gris);cursor:pointer;gap:6px}
.step{display:flex;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--bord);cursor:pointer}.step:last-child{border:0}
.step .ck{width:22px;height:22px;border-radius:50%;border:2px dashed #aaa;flex:none;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff}
.step.ok .ck{background:var(--vert);border:0}.step.ok{color:var(--gris)}
.empty{text-align:center;padding:36px 16px;color:var(--gris)}.empty b{display:block;color:var(--txt);font-size:16px;margin-bottom:6px}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:30;display:flex;align-items:center;justify-content:center;padding:14px}
.mod{background:var(--blanc);width:100%;max-width:480px;max-height:90vh;overflow:auto;border-radius:14px;padding:18px}.mod h3{margin:0 0 6px}



.login input{max-width:300px;text-align:center;background:#222;border-color:#444;color:#fff;margin-bottom:10px}
.dots{display:flex;gap:12px;margin:6px 0 14px}.dots i{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--or)}.dots i.f{background:var(--or)}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:12px}
.pad button{height:64px;border-radius:50%;background:#222;color:#fff;border:1px solid #3a3a3a;font-size:22px;cursor:pointer}
.pad button:active{background:var(--or);color:var(--noir)}

.err{color:#ff9a8f;min-height:20px;font-size:13px;margin-bottom:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:var(--noir);color:#fff;padding:10px 18px;border-radius:8px;z-index:60;font-size:14px;border-left:3px solid var(--or)}
.sticky{position:sticky;bottom:60px;background:var(--fond);padding:10px 0;display:flex;gap:10px;justify-content:flex-end}
@media(min-width:900px){.sticky{bottom:0}}

.poster{position:relative;width:var(--w);aspect-ratio:2/3;background:var(--poster) top/100% 100% no-repeat;flex:none;box-shadow:0 0 40px #000a}
.hot{position:absolute;border:0;background:transparent;border-radius:999px;cursor:pointer;-webkit-appearance:none;padding:0}
.hot:active{background:rgba(255,255,255,.2)}.hot:focus-visible{outline:3px solid #fff}
.hot.h1{left:8.2%;top:63%;width:83.6%;height:9.4%}.hot.h2{left:8%;top:74%;width:84%;height:9.5%}
.pin .col{justify-content:flex-start}
.ptop{width:var(--w);aspect-ratio:1024/950;background:var(--poster) top/100% auto no-repeat;flex:none}
.pfoot{width:var(--w);aspect-ratio:1024/250;background:var(--poster) bottom/100% auto no-repeat;flex:none}
.pbody{width:100%;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 20px;background:linear-gradient(180deg,#3a0610aa,#2a0309cc 30%,#2a0309cc 70%,#3a0610aa)}
.q{font-size:17px;margin:4px 0 10px;color:#fff;font-weight:500;text-align:center}
.pbody input{max-width:310px;text-align:center;background:#1c1012;border-color:#5a3a2a;color:#fff;margin-bottom:10px}
.back{background:none;border:0;color:#e8cf9a;cursor:pointer;margin-top:10px;font-size:14px}
.pin .pad{grid-template-columns:repeat(3,60px);gap:9px}.pin .pad button{height:54px;font-size:20px;border-color:#E7B24A66;background:#2b0b12}
.pin .dots{margin:2px 0 8px}.err{min-height:18px}
@media(max-height:760px){.pin .pad button{height:46px}.pin .pad{gap:7px}}

body.cs:before{content:"";position:fixed;inset:0;background:linear-gradient(180deg,#14000699,#2a030966 40%,#14000699);z-index:-1}
body.cs .main{background:transparent}

body.cs .ph h1{color:#F6D98F;text-shadow:0 2px 6px #000a}
body.cs .ph .btn.sec{background:#1a050999;border-color:#E7B24A88;color:#f3dca0}
body.cs{--txt:#fff;--gris:#E3C79A;--bord:#E7B24A55}
body.cs .card,body.cs .m{background:linear-gradient(180deg,#6b0a1ccc,#3c0510d9);border:1.5px solid #E7B24Acc;box-shadow:0 0 14px #E7B24A44,0 8px 22px #0008;color:#fff;backdrop-filter:blur(3px)}
body.cs .card input,body.cs .card select,body.cs .card textarea{color:#202223}body.cs .card input::placeholder{color:#8a8d90}body.cs .search input{color:#fff!important}body.cs .card .btn.sec{color:#202223}body.cs .ph .btn.sec{color:#f3dca0}
body.cs .card h2,body.cs .m b,body.cs .r .n{color:#fff}
body.cs .card .ch{border-color:#E7B24A66;background:linear-gradient(180deg,#8a1228aa,#6b0a1c66)}
body.cs .card .ch h2{color:#fff;font-size:17px}
body.cs .empty b{color:#fff}
body.cs .th{background-color:#2a0309;border-color:#E7B24A88}
body.cs .search{border-color:#E7B24A44}body.cs .search input{background:#2a0309cc;color:#fff;border-color:#E7B24A88}
body.cs .tabs{border-color:#E7B24A44}body.cs .tabs div.on{color:#F6D98F}
body.cs .step{color:#fff;border-color:#E7B24A44}
body.cs .step .ck{border-color:#E7B24A;color:#fff;background:transparent}body.cs .step.ok .ck{background:radial-gradient(circle,#2fae4e,#0e7a2a);border-color:#F6D98F}
body.cs .side button{border:1.5px solid #E7B24A66;background:linear-gradient(180deg,#7a0f22,#4a0614);color:#fff;border-radius:14px;padding:12px 14px;box-shadow:0 0 8px #0006;margin-bottom:8px}
body.cs .side button svg{stroke:#F6D98F}
body.cs .side button.on{border-color:#F6D98F;box-shadow:0 0 12px #E7B24A99;color:#F6D98F;background:linear-gradient(180deg,#a3162e,#650a1b)}
body.cs .side .brand{flex-direction:column;text-align:center;border-bottom:0}
body.cs .side .brand .logo{width:104px;height:104px}
body.cs .side .brand b{font-size:16px}
.ht{text-align:center;margin:0 0 16px}
.ht h1{margin:0;font-family:Georgia,"Times New Roman",serif;font-size:clamp(28px,6.5vw,52px);letter-spacing:1px;font-weight:700;background:linear-gradient(180deg,#FFF1B8,#E2A02F 55%,#B5760F);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 3px #000a)}
.ht .hr{display:flex;align-items:center;gap:10px;justify-content:center;color:#F6D98F;margin:2px auto}.ht .hr:before,.ht .hr:after{content:"";height:1.5px;width:28%;background:linear-gradient(90deg,transparent,#E7B24A,transparent)}
.ht i{font-family:Georgia,serif;font-size:clamp(15px,3.2vw,24px);color:#fff}
.ht .hi{font-size:13px;color:#E3C79A;margin-top:6px}
.m{display:flex;align-items:center;gap:10px}.m svg{width:34px;height:34px;flex:none;stroke:#F6D98F;fill:none;stroke-width:1.5}
body.cs .m span{color:#fff}
body.cs .bar{background:#1a0509dd;border-bottom:1px solid #E7B24A55;backdrop-filter:blur(6px)}
body.cs .side{background:linear-gradient(180deg,#2a0309ee,#140006ee);border-right:1px solid #E7B24A55}
body.cs .nav{background:#1a0509f2;border-top:1px solid #E7B24A66}
body.cs .nav button{color:#d9c08a}body.cs .nav button.on{color:#F6D98F}body.cs .nav button.on svg{stroke:#F6D98F}
body.cs .sticky{background:linear-gradient(0deg,#140006cc,#14000600)}
body.cs .list .r:hover{background:#FFF1D6}
body.cs .tabs div.on{border-color:#C58A22}
.sph{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sph .sl{position:relative;aspect-ratio:3/4;border:1.5px dashed #c9a35a;border-radius:10px;background:#FFF4DC center/cover no-repeat;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#8a6a2a;font-size:11px;cursor:pointer;text-align:center;gap:4px}
.sph .sl svg{width:22px;height:22px}
.sph .sl .x{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;background:#000a;color:#fff;border:0;font-size:15px;line-height:22px;padding:0;cursor:pointer}
.hint{color:var(--gris);font-size:12px;margin:2px 0 8px}
.bc{display:flex;gap:8px}.bc input{flex:1}
.bcv{margin-top:8px;text-align:center;background:#fff;border-radius:8px;padding:8px}.bcv svg{max-width:100%;height:70px}
body.cs .mod{color:#202223;--txt:#202223;--gris:#6D7175;--bord:#E1E3E5}
body.cs .mod .hint{color:#6D7175}
.fch{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.fch button{background:#1a050999;border:1px solid #E7B24A88;color:#f3dca0;border-radius:20px;padding:7px 13px;cursor:pointer;font-weight:600;font-size:13px}
.fch button.on{background:linear-gradient(180deg,#FBE9A6,#C58A22);color:#4a0c10}
.fcu{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:6px}@media(min-width:760px){.fcu{grid-template-columns:repeat(4,1fr)}}
.fcu label{color:#f3dca0;margin:4px 0}
.fper{color:#F6D98F;font-weight:600;margin:4px 0 12px}
.f3{grid-template-columns:repeat(2,1fr)}@media(min-width:900px){.f3{grid-template-columns:repeat(3,1fr)}}
.m.neg b{color:#ff9aa6}.m.pos b{color:#8be9aa}
.fr{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #E7B24A33;color:#fff}.fr:last-child{border:0}
.fr small{color:#E3C79A;font-weight:400}.fr.sum{font-weight:700;border-top:1px solid #E7B24A99}
.fr.pos b{color:#8be9aa}.fr.neg b{color:#ff9aa6}.neg2{color:#ff9aa6}
.bars{display:flex;align-items:flex-end;gap:4px;height:170px;overflow-x:auto;padding-bottom:2px}
.bc2{flex:1;min-width:22px;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px}
.bc2 i{display:block;width:100%;max-width:34px;background:linear-gradient(180deg,#FBE9A6,#C58A22);border-radius:5px 5px 0 0}
.bc2 span{font-size:10px;color:#E3C79A}
.r2{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid #E7B24A33;cursor:pointer;color:#fff}
.r2 .s{font-size:12px;color:#E3C79A}.r2:last-child{border:0}.r2:hover{background:#ffffff10}
.r2.g4{display:grid;grid-template-columns:1fr 50px 100px 100px;cursor:default;font-size:13px}.r2.hd2{display:grid;grid-template-columns:1fr 50px 100px 100px;color:#F6D98F;font-weight:600;font-size:12px;cursor:default}
.fsum{padding:8px 16px;color:#E3C79A;border-bottom:1px solid #E7B24A33}.fsum b{color:#fff}

function idbGet(k){return new Promise(function(ok){if(!IDBX)return ok(null);try{var q=IDBX.transaction("kv").objectStore("kv").get(k);q.onsuccess=function(){ok(q.result||null)};q.onerror=function(){ok(null)}}catch(e){ok(null)}})}
var idbT=null;
function idbSave(){clearTimeout(idbT);idbT=setTimeout(function(){if(!IDBX)return;try{var t=IDBX.transaction("kv","readwrite");t.objectStore("kv").put(JSON.parse(JSON.stringify(DB)),"db");t.onerror=function(){toast("Mémoire de l'appareil pleine")}}catch(e){toast("Mémoire de l'appareil pleine")}},250)}
async function load(){
 COLS.forEach(function(c){DB[c]={}});
 await idbOpen();var d=await idbGet("db");
 if(!d){try{d=JSON.parse(localStorage.getItem(LS)||"null")}catch(e){d=null}}

 try{Object.assign(cfg,JSON.parse(localStorage.getItem(SS)||"{}"))}catch(e){}
 try{dirty=JSON.parse(localStorage.getItem(LS+"_d")||"{}")}catch(e){dirty={}}
 if(IDBX&&d){try{localStorage.removeItem(LS)}catch(e){}}
 if(IDBX)idbSave()}
function persist(){
 if(IDBX)idbSave();else{try{localStorage.setItem(LS,JSON.stringify(DB))}catch(e){toast("Mémoire de l'appareil pleine")}}
 try{localStorage.setItem(SS,JSON.stringify(cfg));localStorage.setItem(LS+"_d",JSON.stringify(dirty))}catch(e){}}
function put(col,rec){if(!rec.id)rec.id=uid();rec._maj=Date.now();DB[col][rec.id]=rec;dirty[col+"|"+rec.id]=1;persist();syncSoon();return rec}
function del(col,id){var r=DB[col][id];if(!r)return;r._del=true;r._maj=Date.now();dirty[col+"|"+id]=1;persist();syncSoon()}
function list(col){return Object.keys(DB[col]).map(function(k){return DB[col][k]}).filter(function(r){return!r._del})}
var st=null;function syncSoon(){clearTimeout(st);st=setTimeout(sync,1500)}
function hdr(){var h={apikey:cfg.key,"Content-Type":"application/json"};if(/^eyJ/.test(cfg.key))h.Authorization="Bearer "+cfg.key;return h}
async function rpc(fn,body){var r=await fetch(cfg.url.replace(/\/+$/,"")+"/rest/v1/rpc/"+fn,{method:"POST",headers:hdr(),body:JSON.stringify(body)});if(!r.ok){var tx="";try{tx=await r.text()}catch(e){}if(/code invalide|42501/.test(tx))throw new Error("code de synchronisation incorrect");if(r.status===404)throw new Error("script SQL pas encore exécuté");throw new Error(fn+" "+r.status)}return r.json()}
function vitrineRow(p,maj){return{id:"vitrine|"+p.id,collection:"vitrine",data:{id:p.id,nom:p.nom,prix:p.pv,ancien:p.ancien||0,etiquette:p.etiquette||"",categorie:p.categorie||"",description:p.description||"",photo:p.photo||"",photos:p.photosSite||[],tailles:p.tailles||[],couleurs:p.couleurs||[],dispo:(Number(p.stock)||0)>0,sv:p.vs?p.sv:null},maj:maj,supprime:!p.enligne||!!p._del}}
async function sync(){
 if(!cfg.url||!cfg.key||!cfg.code){return}
 try{
  var keys=Object.keys(dirty);
  while(keys.length){var part=[],sz=0;
   while(keys.length&&part.length<8&&sz<900000){var k=keys.shift(),p=k.split("|"),r=DB[p[0]]&&DB[p[0]][p[1]];if(!r){delete dirty[k];continue}var mj=new Date(r._maj).toISOString(),rows=[{id:k,collection:p[0],data:r,maj:mj,supprime:!!r._del}];if(p[0]==="produits")rows.push(vitrineRow(r,mj));rows.forEach(function(x){sz+=JSON.stringify(x).length});part.push({k:k,rows:rows})}
   if(!part.length)break;var flat=[];part.forEach(function(x){flat=flat.concat(x.rows)});
   await rpc("app_ecrire",{p_code:cfg.code,p_rows:flat});part.forEach(function(x){delete dirty[x.k]});persist()}
  var since=cfg.last?new Date(new Date(cfg.last).getTime()-60000).toISOString():"1970-01-01T00:00:00Z",ch=0,mx=cfg.last;
  for(var pg=0;pg<300;pg++){
   var rows2=(await rpc("app_lire",{p_code:cfg.code,p_depuis:since,p_limite:40}))||[];
   rows2.forEach(function(x){var d=x.data;if(!DB[x.collection])return;var loc=DB[x.collection][d.id];if(!loc||(loc._maj||0)<(d._maj||0)){d._del=x.supprime||d._del;DB[x.collection][d.id]=d;ch++}if(!mx||x.maj>mx)mx=x.maj});
   if(rows2.length<40)break;since=rows2[rows2.length-1].maj}
  cfg.last=mx||new Date().toISOString();persist();S.sync="Synchronisé à "+new Date().toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});
  if(ch&&!S.edit&&!modalOpen())render();
 }catch(e){S.sync="Synchro impossible ("+e.message+")"}
}

var L_=["0001101","0011001","0010011","0111101","0100011","0110001","0101111","0111011","0110111","0001011"];
var PAR=["LLLLLL","LLGLGG","LLGGLG","LLGGGL","LGLLGG","LGGLLG","LGGGLL","LGLGLG","LGLGGL","LGGLGL"];
function ean13Chk(d12){var t=0;for(var i=0;i<12;i++)t+=Number(d12[i])*(i%2?3:1);return String((10-t%10)%10)}
function ean13Svg(code){
 if(!/^\d{13}$/.test(code)||ean13Chk(code.slice(0,12))!==code[12])return"";
 var pr=PAR[code[0]],b="101";
 for(var i=1;i<=6;i++){var l=L_[code[i]];b+=pr[i-1]==="L"?l:l.split("").reverse().map(function(x){return x==="0"?"1":"0"}).join("")}
 b+="01010";
 for(i=7;i<=12;i++)b+=L_[code[i]].split("").map(function(x){return x==="0"?"1":"0"}).join("");
 b+="101";var r="",w=3;
 for(i=0;i<b.length;i++)if(b[i]==="1")r+='<rect x="'+(i*w+10)+'" y="2" width="'+w+'" height="70" fill="#000"/>';
 return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+(b.length*w+20)+' 92"><rect width="100%" height="100%" fill="#fff"/>'+r+'<text x="'+((b.length*w+20)/2)+'" y="88" font-family="monospace" font-size="16" text-anchor="middle">'+code+'</text></svg>'}

 if(e.target.id==="pf"&&e.target.files[0]){readPhoto(e.target.files[0],function(d){tmpPhoto=d;var ph=$("#ph");ph.style.backgroundImage="url("+d+")";ph.innerHTML=""})}
 if(e.target.id==="sf"&&e.target.files[0]){readPhoto(e.target.files[0],function(d){var L=siteList(S.edit.id?DB.produits[S.edit.id]:{}).slice();if(L[siteIdx]!==undefined&&siteIdx<L.length)L[siteIdx]=d;else L.push(d);tmpSite=L.slice(0,3);$("#sph").innerHTML=siteSlots({})},900,.78);e.target.value=""}
 if(e.target.id==="f_b"){var l=$("#l_pa");if(l)l.textContent=btype(e.target.value)==="depot"?"Prix reversé au déposant":"Prix d'achat"}
});
document.addEventListener("keydown",function(e){
 if(e.key==="Enter"&&e.target.id==="cq"){var c=e.target.value.trim();var p=c&&list("produits").filter(function(x){return String(x.codebarre||"")===c})[0];if(p){e.preventDefault();S.cq="";if((Number(p.stock)||0)<=0)toast("Article en rupture");else if((p.tailles||[]).length||(p.couleurs||[]).length)S.pick={pid:p.id,t:"",c:""};else addLine(p);render();var n=$("#cq");if(n)n.focus();return}}
if(S.user||!list("users").length||!S.entry||/INPUT|TEXTAREA/.test(e.target.tagName))return;if(/^\d$/.test(e.key))document.querySelector('[data-a="k"][data-v="'+e.key+'"]').click();else if(e.key==="Backspace")document.querySelector('[data-a="kc"]').click();else if(e.key==="Enter")document.querySelector('[data-a="ko"]').click()});
 document.addEventListener("input",function(e){var id=e.target.id,v=e.target.value,cn=e.target.classList;
 if(cn.contains("vgi")){vgSum();return}
 if(cn.contains("cli")){clUpd();return}
 if(id==="cl_t"){clUpd();return}
 if(id==="f_ta"||id==="f_co"){refreshVG();return}
 if(id==="kq"){S.kq=v;render();return}
 if(id==="rc_fo"){S.rcv.fo=v;return}if(id==="rc_d"){S.rcv.d=v;return}if(id==="rc_n"){S.rcv.note=v;return}if(id==="rc_q"){S.rcv.cur.q=v;return}if(id==="rc_a"){S.rcv.cur.a=v;return}
 if(id==="rt_m"){S.rt.montant=Number(v)||0;S.rt.manual=true;return}
 if(id==="fq"){S.fq=v;render();return}
 if(id==="f_bc"){var bv=$("#bcv");if(bv){var sv=ean13Svg(v.trim());bv.innerHTML=sv;bv.style.display=sv?"":"none"}return}
 if(id==="q"){S.q=v;render()}
 else if(id==="cq"){S.cq=v;render()}
 else if(id==="k_nom"){S.cli.nom=v;var c=list("clients").filter(function(x){return x.nom===v})[0];if(c&&c.tel){S.cli.tel=c.tel;var t=$("#k_tel");if(t)t.value=c.tel}}
 else if(id==="k_tel"){S.cli.tel=v}
 else if(id==="r_val"){S.rem.val=Number(v)||0;updCalc()}
 else if(id==="r_recu"){S.recu=v;updCalc()}
 else if(id==="r_acompte"){S.acompte=v;updCalc()}});

var su=sessionStorage.getItem("als_u"),sm=sessionStorage.getItem("als_m");if(su&&sm&&DB.users[su]&&!DB.users[su]._del&&(sm==="caisse"||DB.users[su].role==="admin")){S.user=DB.users[su];S.mode=S.entry=sm;S.tab=sm==="caisse"?"caisse":"accueil";boutiqueDefaut()}
render();sync();
if("serviceWorker" in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register("sw.js").catch(function(){});
window.addEventListener("online",function(){sync();if(!modalOpen())render()});window.addEventListener("offline",function(){if(!modalOpen())render()});
setInterval(function(){if(S.user&&!S.edit&&!modalOpen())sync()},60000);
});
